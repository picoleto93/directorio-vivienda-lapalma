<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Vivienda La Palma</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;height:100vh;display:flex;justify-content:center;align-items:center}
.chat-container{width:100%;max-width:480px;height:100vh;max-height:900px;background:#fff;display:flex;flex-direction:column;position:relative}
@media(min-width:500px){.chat-container{height:90vh;box-shadow:0 4px 24px rgba(0,0,0,.08);border-radius:0}}
.chat-header{padding:16px 20px 12px;border-bottom:1px solid #eee;text-align:center}
.chat-header h1{font-size:17px;font-weight:600;color:#222}
.chat-header p{font-size:12px;color:#777;margin-top:2px}
.chat-header .model-status{font-size:11px;color:#999;margin-top:4px}
.messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.message{max-width:85%;padding:10px 14px;font-size:14px;line-height:1.5;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.message.bot{background:transparent;align-self:flex-start;padding:10px 0;border-bottom:1px solid #f0f0f0}
.message.user{background:#e8f0fe;color:#1a1a1a;align-self:flex-end;border-radius:12px 12px 4px 12px}
.message.system{color:#888;align-self:center;font-size:12px;max-width:80%;text-align:center;padding:6px 12px}
.quick-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick-btn{background:transparent;color:#555;border:1px solid #ddd;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;transition:all .15s}
.quick-btn:hover{background:#f5f5f5;border-color:#bbb}
.quick-btn:disabled{opacity:.5;cursor:wait}
.result-card{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.result-card:last-child{border-bottom:none}
.card-img{width:110px;min-width:110px;height:90px;border-radius:6px;overflow:hidden;position:relative;cursor:pointer;background:#f5f5f5}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;top:5px;left:5px;font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;color:#fff;line-height:1.3}
.badge-venta{background:#2e7d32}
.badge-alquiler{background:#1565c0}
.badge-vacacional{background:#e65100}
.card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.card-body .title{font-weight:500;font-size:14px;color:#222;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-body .price{font-size:16px;font-weight:600;color:#1a73e8;line-height:1.3}
.card-body .price .m2{font-size:11px;font-weight:400;color:#999}
.card-body .details{display:flex;flex-wrap:wrap;gap:2px}
.card-body .detail-tag{background:#f5f5f5;padding:2px 7px;border-radius:8px;font-size:10px;color:#666}
.card-body .meta{font-size:11px;color:#aaa;line-height:1.3}
.card-body .meta .fuente{color:#1a73e8;font-weight:500}
.btn-yaencontre{display:inline-flex;align-items:center;gap:3px;background:transparent;border:none;color:#1a73e8;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500;text-decoration:none;cursor:pointer;transition:all .15s;align-self:flex-start}
.btn-yaencontre:hover{background:#e8f0fe}
.result-card .warning{color:#999;font-size:11px;margin-top:2px;padding:0}
.result-card .relevance{font-size:10px;color:#999;margin-top:1px}
.input-area{display:flex;gap:8px;padding:10px 16px;border-top:1px solid #eee;background:#fff}
.input-area input{flex:1;padding:10px 14px;border:1px solid #e0e0e0;border-radius:20px;font-size:14px;outline:none;transition:border .15s}
.input-area input:focus{border-color:#1a73e8}
.input-area button{background:#1a73e8;color:#fff;border:none;width:38px;height:38px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.input-area button:hover{background:#1557b0}
.input-area button:disabled{opacity:.5;cursor:default}
.typing{display:flex;gap:3px;padding:6px 0}
.typing span{width:5px;height:5px;background:#ccc;border-radius:50%;animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.progress-bar{height:2px;background:#f0f0f0;overflow:hidden;margin-top:4px}
.progress-bar .fill{height:100%;background:#1a73e8;width:0%;transition:width .3s ease}
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h1>Vivienda La Palma</h1>
    <p>Búsqueda inteligente · <span id="propCount">442</span> viviendas en La Palma</p>
    <div class="model-status" id="modelStatus">Iniciando motor de IA...</div>
    <div class="model-status" id="dataStatus" style="font-size:10px"></div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-area">
    <input type="text" id="input" placeholder="Ej: un piso barato en Los Llanos con garaje" autofocus>
    <button id="sendBtn">→</button>
  </div>
</div>

<script type="module">
import { pipeline, cos_sim } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';

let props = [];
let DATA_META = {};
const PROPIEDADES_URL = "propiedades.json";

async function loadData() {
  try {
    const resp = await fetch(PROPIEDADES_URL + "?t=" + Date.now());
    if (resp.ok) {
      const data = await resp.json();
      props = data.propiedades || [];
      DATA_META = data.meta || {};
      document.getElementById("propCount").textContent = props.length;
      const fecha = DATA_META.fecha_actualizacion || "";
      document.getElementById("dataStatus").textContent = fecha ? "📅 Actualizado: " + fecha : "";
      if (typeof initModel === "function") initModel();
    }
  } catch (e) {
    console.error("Error cargando propiedades.json:", e);
    addMessage("⚠️ No se pudieron cargar los datos de viviendas. Verifica la conexión e intenta recargar la página.", "system");
    if (typeof initModel === "function") initModel();
  }
}
let extractor = null;
let propEmbeddings = [];
let modelReady = false;
let fallbackMode = false;
let ctx = { zonas: [], tipos: [], operaciones: [], precioMin: 0, precioMax: Infinity, dormMin: null, extras: [], sortBy: null };

function mergeContext(filters, query) {
  const q = normalize(query);
  const resetWords = ["nueva busqueda", "nueva búsqueda", "reset", "reiniciar", "empezar de nuevo", "limpiar", "otra cosa", "olvidar", "borrar", "nuevo"];
  if (resetWords.some(w => q.includes(w))) { ctx = { zonas: [], tipos: [], operaciones: [], precioMin: 0, precioMax: Infinity, dormMin: null, extras: [], sortBy: null }; return filters; }

  if (filters.zonas.length === 0 && ctx.zonas.length > 0) filters.zonas = [...ctx.zonas];
  else if (filters.zonas.length > 0) ctx.zonas = [...filters.zonas];

  if (filters.tipos.length === 0 && ctx.tipos.length > 0) filters.tipos = [...ctx.tipos];
  else if (filters.tipos.length > 0) ctx.tipos = [...filters.tipos];

  if (filters.operaciones.length === 0 && ctx.operaciones.length > 0) filters.operaciones = [...ctx.operaciones];
  else if (filters.operaciones.length > 0) ctx.operaciones = [...filters.operaciones];

  if (filters.precioMax === Infinity && ctx.precioMax < Infinity) { filters.precioMax = ctx.precioMax; }
  else if (filters.precioMax < Infinity) ctx.precioMax = filters.precioMax;

  if (filters.precioMin === 0 && ctx.precioMin > 0) filters.precioMin = ctx.precioMin;
  else if (filters.precioMin > 0) ctx.precioMin = filters.precioMin;

  if (filters.dormMin === null && ctx.dormMin !== null) filters.dormMin = ctx.dormMin;
  else if (filters.dormMin !== null) ctx.dormMin = filters.dormMin;

  if (filters.extras.length === 0 && ctx.extras.length > 0) filters.extras = [...ctx.extras];
  else if (filters.extras.length > 0) ctx.extras = [...filters.extras];

  if (!filters.sortBy && ctx.sortBy) filters.sortBy = ctx.sortBy;
  else if (filters.sortBy) ctx.sortBy = filters.sortBy;

  return filters;
}

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
const modelStatus = document.getElementById("modelStatus");

function normalize(s) {
  return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function formatPrecio(n) {
  return new Intl.NumberFormat("es-ES", {style:"currency",currency:"EUR",maximumFractionDigits:0}).format(n);
}

function getOperacionBadge(operacion) {
  if (operacion === "alquiler") return '<span class="badge badge-alquiler">ALQUILER</span>';
  if (operacion === "vacacional") return '<span class="badge badge-vacacional">VACACIONAL</span>';
  return '<span class="badge badge-venta">COMPRAR</span>';
}

function formatCard(prop, score) {
  const tags = [];
  if (prop.dormitorios) tags.push(`${prop.dormitorios} hab`);
  if (prop.banos) tags.push(`${prop.banos} baño${prop.banos > 1 ? "s" : ""}`);
  if (prop.metros) tags.push(`${prop.metros} m²`);
  if (prop.piscina) tags.push("Piscina");
  if (prop.garaje) tags.push("Garaje");
  if (prop.terraza) tags.push("Terraza");
  if (prop.ascensor) tags.push("Ascensor");
  if (prop.vistas_mar) tags.push("Vistas mar");
  if (prop.reformado) tags.push("Reformado");
  if (prop.amueblado) tags.push("Amueblado");
  if (prop.trastero) tags.push("Trastero");
  if (prop.jardin) tags.push("Jardín");
  const tagHtml = tags.map(t => `<span class="detail-tag">${t}</span>`).join("");

  const warning = (!prop.verificada || !prop.activa)
    ? (prop.fuente && prop.fuente.toLowerCase().includes("infoisla") && !prop.fuente.toLowerCase().includes("infoislalapalma")
      ? `<div class="warning">Dato histórico (infoisla.com caído)</div>`
      : `<div class="warning">Dato extraído de web externa — confirma con el anunciante</div>`)
    : "";

  const pct = score !== undefined ? Math.round(score * 100) : null;
  const rel = pct !== null ? `<div class="relevance">Coincidencia: ${pct}%</div>` : "";
  const precioM2 = prop.precio_m2 ? `<span class="m2"> · ${formatPrecio(prop.precio_m2)}/m²</span>` : "";
  const imgHtml = prop.imagen_principal
    ? `<div class="card-img" onclick="window.open('${prop.url}','_blank')"><img src="${prop.imagen_principal}" alt="" loading="lazy">${getOperacionBadge(prop.operacion)}</div>`
    : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;font-size:24px;color:#ccc">🏠${getOperacionBadge(prop.operacion)}</div>`;

  return `<div class="result-card">
    ${imgHtml}
    <div class="card-body">
      <div class="title">${prop.titulo}</div>
      <div class="price">${formatPrecio(prop.precio)}${precioM2}</div>
      <div class="details">${tagHtml}</div>
      <div class="meta"><span class="fuente">${prop.fuente}</span> · ${prop.zona}</div>
      <a class="btn-yaencontre" href="${prop.url}" target="_blank">🔗 Ver en yaencontre</a>
      ${rel}${warning}
    </div>
  </div>`;
}

function buildPropertyText(prop) {
  const t = prop.tipo;
  const features = [];
  const op = prop.operacion === "alquiler" ? "alquiler" : prop.operacion === "vacacional" ? "vacacional" : "venta compra";
  features.push(`se ${op === "venta compra" ? "vende" : op === "alquiler" ? "alquila" : "alquila vacacional"}`);
  if (t === "obra_nueva") features.push("obra nueva llave en mano estreno promocion nueva construccion");
  else if (t === "chalet") features.push("chalet casa independiente villa unifamiliar");
  else if (t === "adosada") features.push("casa adosada casa pareada");
  else if (t === "apartamento") features.push("apartamento piso vivienda centrico");
  else if (t === "casa") features.push("casa vivienda unifamiliar casa terrera casa rural");
  else if (t === "piso") features.push("piso vivienda centrico");
  else if (t === "estudio") features.push("estudio loft estudio abierto");
  else if (t === "desarrollo") features.push("desarrollo obra nueva promocion");
  else features.push("inmueble propiedad vivienda");
  if (prop.dormitorios) features.push(`${prop.dormitorios} dormitorios ${prop.dormitorios} habitaciones ${prop.dormitorios} hab`);
  if (prop.banos) features.push(`${prop.banos} banos ${prop.banos} cuartos de bano ${prop.banos} bannos`);
  if (prop.metros) features.push(`${prop.metros} metros cuadrados ${prop.metros} m2 construidos superficie`);
  if (prop.metros_parcela) features.push(`parcela ${prop.metros_parcela} metros solar terreno`);
  if (prop.piscina) features.push("piscina comunitaria privada climatizada pileta");
  if (prop.garaje) features.push("garaje parking cochera estacionamiento plaza de garaje");
  if (prop.terraza) features.push("terraza balcon solarium porche patio");
  if (prop.ascensor) features.push("ascensor elevador");
  if (prop.vistas_mar) features.push("vistas al mar oceanicas frente al mar primera linea playa");
  if (prop.reformado) features.push("reformado renovado rehabilitado restaurado");
  if (prop.amueblado) features.push("amueblado equipado con muebles llave en mano");
  if (prop.trastero) features.push("trastero almacen cuarto almacenamiento");
  if (prop.jardin) features.push("jardin zonas verdes area recreativa parque");
  if (prop.estado === "obra_nueva") features.push("obra nueva estreno");
  const extraTerms = ["barbacoa", "chimenea", "calefaccion central individual", "aire acondicionado aa climatizacion",
    "cocina equipada americana independiente office", "armarios empotrados", "doble acristalamiento climalit",
    "suelo radiante parquet gres porcelanico", "suite master en suite", "vestidor",
    "despacho oficina en casa", "luminoso exterior mucha luz soleado",
    "gimnasio pista padel deporte", "eficiencia energetica", "placas solares fotovoltaica renovable",
    "domotica smart home automatizacion", "videoportero", "puerta blindada acorazada seguridad alarma",
    "persianas electricas automaticas toldos", "zonas infantiles parque infantil columpios",
    "mascotas permitidas perros gatos animales", "pueblo casco urbano centro centrico",
    "zona tranquila residencial urbanizacion", "bien comunicado cerca servicios colegios supermercado"];
  features.push(...extraTerms);
  const precio = prop.precio
    ? `. Precio: ${prop.precio} euros. ${prop.precio_m2 ? `Precio por metro cuadrado: ${prop.precio_m2} euros m2. ` : ""}`
    : ". ";
  return `${prop.titulo}. ${prop.descripcion} ${features.join(" ")}${precio} Zona: ${prop.zona}, ${prop.zona === "Otros" ? "" : "La Palma, Canarias"}.`;
}

async function initModel() {
  modelStatus.textContent = "Descargando modelo de IA (~23MB, solo la primera vez)...";
  try {
    extractor = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', {
      progress_callback: (data) => {
        if (data.status === 'progress' && typeof data.progress === 'number') {
          const pct = Math.round(data.progress * 100);
          modelStatus.textContent = `Descargando modelo: ${pct}%`;
        }
      }
    });
    modelStatus.textContent = "Modelo listo — puedes preguntar en lenguaje natural";
    modelReady = true;

    const texts = props.map(buildPropertyText);
    const embeddings = await extractor(texts, { pooling: 'mean', normalize: true });
    propEmbeddings = embeddings.tolist();
  } catch (e) {
    console.warn("Transformers.js no disponible, usando modo búsqueda clásica:", e);
    modelStatus.textContent = "Modo búsqueda clásica activo";
    fallbackMode = true;
    modelReady = true;
  }
}

function extractFilters(query) {
  const q = normalize(query);
  const filters = { operaciones: [], zonas: [], tipos: [], precioMax: Infinity, precioMin: 0, dormMin: null, extras: [], descKeywords: [], detected: [] };
  const w = (word) => new RegExp("\\b" + normalize(word) + "\\b", "i").test(q);

  const ZONAS_MAP = {
    "los llanos": "Los Llanos de Aridane","llanos": "Los Llanos de Aridane",
    "el paso": "El Paso",
    "tazacorte": "Tazacorte",
    "santa cruz": "Santa Cruz de La Palma","capital": "Santa Cruz de La Palma",
    "brena alta": "Breña Alta",
    "brena baja": "Breña Baja",
    "villa de mazo": "Villa de Mazo","mazo": "Villa de Mazo",
    "fuencaliente": "Fuencaliente",
    "puntallana": "Puntallana",
    "tijarafe": "Tijarafe",
    "barlovento": "Barlovento",
    "garafia": "Garafía","garafía": "Garafía",
    "san andres": "San Andrés y Sauces","sauces": "San Andrés y Sauces",
    "puntagorda": "Puntagorda",
    "triana": "Los Llanos de Aridane","puerto de tazacorte": "Tazacorte","playa de tazacorte": "Tazacorte",
    "argual": "Los Llanos de Aridane","todoque": "Los Llanos de Aridane"
  };
  for (const [k, v] of Object.entries(ZONAS_MAP)) {
    if (w(k) && !filters.zonas.includes(v)) { filters.zonas.push(v); filters.detected.push("zona: " + v); }
  }

  const TIPOS_MAP = {
    "piso": "piso","apartamento": "apartamento","casa": "casa","chalet": "chalet","adosada": "adosada",
    "obra nueva": "obra_nueva","obra nueva": "obra_nueva","desarrollo": "desarrollo",
    "estudio": "estudio","loft": "estudio",
    "duplex": "apartamento","atico": "apartamento",
    "casa terrera": "casa","casa rural": "casa","casa de pueblo": "casa","casa adosada": "adosada","casa pareada": "adosada",
    "vivienda": "piso","inmueble": "piso","propiedad": "piso"
  };
  for (const [k, v] of Object.entries(TIPOS_MAP)) {
    if (w(k) && !filters.tipos.includes(v)) { filters.tipos.push(v); filters.detected.push("tipo: " + v); }
  }

  const OPERACION_MAP = {
    "comprar": "venta","compra": "venta","venta": "venta","adquirir": "venta",
    "alquiler": "alquiler","alquilar": "alquiler","renta": "alquiler","arrendar": "alquiler",
    "vacacional": "vacacional","vacaciones": "vacacional","temporada": "vacacional","turistica": "vacacional",
  };
  for (const [k, v] of Object.entries(OPERACION_MAP)) {
    if (w(k) && !filters.operaciones.includes(v)) { filters.operaciones.push(v); filters.detected.push("operacion: " + v); }
  }

  const m = query.match(/(\d+)\s*(?:k|mil)/i);
  if (m) { filters.precioMax = parseInt(m[1]) * 1000; filters.detected.push("precio max: " + filters.precioMax); }
  else {
    const rangeMatch = query.match(/(?:entre|de)\s+(\d+)(?:\s*(?:k|mil|\.|,))?\s*(?:y|a)\s+(\d+)(?:\s*(?:k|mil|\.|,))?/i);
    if (rangeMatch) {
      filters.precioMin = parseInt(rangeMatch[1]) * (rangeMatch[1].length <= 3 ? 1000 : 1);
      filters.precioMax = parseInt(rangeMatch[2]) * (rangeMatch[2].length <= 3 ? 1000 : 1);
      filters.detected.push("precio min: " + filters.precioMin);
      filters.detected.push("precio max: " + filters.precioMax);
    } else {
      const m2 = query.match(/(\d{4,7})/);
      if (m2) { filters.precioMax = parseInt(m2[1]); filters.detected.push("precio max: " + filters.precioMax); }
    }
  }

  const b = query.match(/(\d+)\s*(?:hab|dormitorio|dorm|habs|dormi)/i);
  if (b) { filters.dormMin = parseInt(b[1]); filters.detected.push("min dorm: " + filters.dormMin); }
  else {
    const b2 = query.match(/(\d+)\s*(?:dormitorios|habitaciones|dormitorios|dorms)/i);
    if (b2) { filters.dormMin = parseInt(b2[1]); filters.detected.push("min dorm: " + filters.dormMin); }
  }

  const EXTRA_MAP = {
    "piscina": "piscina","piscinas": "piscina","pileta": "piscina","piscina comunitaria": "piscina","piscina privada": "piscina","piscina climatizada": "piscina","piscina infantil": "piscina",
    "garaje": "garaje","parking": "garaje","park": "garaje","plaza garaje": "garaje","garaje doble": "garaje","cochera": "garaje","estacionamiento": "garaje","aparcamiento": "garaje","garaje cerrado": "garaje",
    "terraza": "terraza","balcon": "terraza","balcon": "terraza","solarium": "terraza","solarium": "terraza","porche": "terraza","patio": "terraza","terraza cubierta": "terraza","terraza descubierta": "terraza",
    "ascensor": "ascensor","elevador": "ascensor","ascensores": "ascensor","ascensor": "ascensor",
    "vistas": "vistas_mar","vistas mar": "vistas_mar","vista mar": "vistas_mar","vistas al mar": "vistas_mar","vista al mar": "vistas_mar","vistas oceano": "vistas_mar","vistas oceanicas": "vistas_mar",
    "frente mar": "vistas_mar","frente al mar": "vistas_mar","primera linea mar": "vistas_mar","primera linea de playa": "vistas_mar","mar": "vistas_mar","oceano": "vistas_mar",
    "reformado": "reformado","renovado": "reformado","rehabilitado": "reformado","restaurado": "reformado","semi reformado": "reformado","a reformar": "reformado","para reformar": "reformado",
    "amueblado": "amueblado","equipado": "amueblado","mobiliario": "amueblado","con muebles": "amueblado","llave en mano": "amueblado","decorado": "amueblado",
    "trastero": "trastero","almacen": "trastero","cuarto trastero": "trastero","almacenamiento": "trastero","trasteros": "trastero",
    "jardin": "jardin","jardines": "jardin","zonas verdes": "jardin","area recreativa": "jardin","parque": "jardin","jardin privado": "jardin","jardin comunitario": "jardin"
  };
  for (const [k, v] of Object.entries(EXTRA_MAP)) {
    if (w(k) && !filters.extras.includes(v)) { filters.extras.push(v); filters.detected.push("extra: " + v); }
  }

  const DESC_KEYWORDS = [
    "casa terrera","terrera",
    "chimenea",
    "barbacoa",

function applyFilters(prop, filters) {
  if (filters.operaciones.length > 0 && !filters.operaciones.includes(prop.operacion)) return false;
  if (filters.zonas.length > 0 && !filters.zonas.some(z => normalize(prop.zona).includes(normalize(z)))) return false;
  if (filters.tipos.length > 0 && !filters.tipos.includes(prop.tipo)) return false;
  if (prop.precio < filters.precioMin) return false;
  if (prop.precio > filters.precioMax) return false;
  if (filters.dormMin !== null && (prop.dormitorios === null || prop.dormitorios < filters.dormMin)) return false;
  for (const ex of filters.extras) {
    if (prop[ex] !== true) return false;
  }
  return true;
}

async function searchClassic(query, filters) {
  const q = normalize(query);
  let results = props.filter(p => applyFilters(p, filters));

  if (results.length === 0 && filters.zonas.length === 0 && filters.tipos.length === 0) {
    results = [...props];
  }

  results = results.map(p => {
    let score = 0.1;
    const desc = normalize(p.descripcion + " " + p.titulo + " " + p.zona + " " + buildPropertyText(p));
    if (q.length > 2) {
      const qWords = q.split(/\s+/).filter(w => w.length > 2);
      const matchCount = qWords.filter(w => desc.includes(w)).length;
      if (matchCount > 0) score += (matchCount / qWords.length) * 0.5;
      if (desc.includes(q)) score += 0.3;
    }
    for (const kw of filters.descKeywords) {
      const kwNorm = normalize(kw);
      if (desc.includes(kwNorm)) score += 0.1;
    }
    if (filters.sortBy === "precio") {
      const maxPrecio = 500000;
      score += (1 - Math.min(p.precio / maxPrecio, 1)) * 0.2;
    }
    if (filters.sortBy === "metros" && p.metros) {
      score += (Math.min(p.metros / 300, 1)) * 0.2;
    }
    return { prop: p, score: Math.min(score, 0.99) };
  });

  if (filters.sortBy === "precio") results.sort((a, b) => a.prop.precio - b.prop.precio);
  else if (filters.sortBy === "metros") results.sort((a, b) => (b.prop.metros || 0) - (a.prop.metros || 0));
  else results.sort((a, b) => b.score - a.score);

  return results;
}

async function searchSemantic(query, filters) {

  const queryEmb = await extractor(query, { pooling: 'mean', normalize: true });
  const qVec = queryEmb.tolist()[0];

  let scored = props.map((prop, i) => {
    const semScore = cos_sim(qVec, propEmbeddings[i]);
    const passesFilters = applyFilters(prop, filters);
    let bonus = 0;
    if (passesFilters) {
      bonus += 0.15;
      if (filters.zonas.length > 0 && filters.zonas.some(z => normalize(prop.zona).includes(normalize(z)))) bonus += 0.08;
      if (filters.tipos.length > 0 && filters.tipos.includes(prop.tipo)) bonus += 0.05;
    } else if (filters.operaciones.length > 0 || filters.zonas.length > 0 || filters.tipos.length > 0 || filters.extras.length > 0) {
      bonus = -0.2;
    }
    if (filters.sortBy === "precio") {
      const maxP = 500000;
      bonus += (1 - Math.min(prop.precio / maxP, 1)) * 0.1;
    }
    if (filters.sortBy === "metros" && prop.metros) {
      bonus += (Math.min(prop.metros / 300, 1)) * 0.1;
    }
    const finalScore = Math.max(0, Math.min(1, semScore + bonus));
    return { prop, score: finalScore, semScore, passesFilters };
  });

  scored = scored.filter(r => r.passesFilters || (filters.operaciones.length === 0 && filters.zonas.length === 0 && filters.tipos.length === 0 && filters.extras.length === 0 && filters.dormMin === null));
  if (scored.length === 0) scored = props.map(p => {
    const semScore = cos_sim(qVec, propEmbeddings[props.indexOf(p)]);
    return { prop: p, score: semScore, semScore, passesFilters: false };
  });

  if (filters.sortBy === "precio") scored.sort((a, b) => a.prop.precio - b.prop.precio);
  else if (filters.sortBy === "metros") scored.sort((a, b) => (b.prop.metros || 0) - (a.prop.metros || 0));
  else scored.sort((a, b) => b.score - a.score);

  return scored.map(r => ({ prop: r.prop, score: r.score }));
}

async function buscar(query, withContext) {
  let filters = extractFilters(query);
  if (withContext) filters = mergeContext(filters, query);
  if (fallbackMode || !modelReady) {
    return searchClassic(query, filters);
  }
  return searchSemantic(query, filters);
}

function quickSearch(q) {
  inputEl.value = q;
  sendMessage();
}

async function sendMessage() {
  const query = inputEl.value.trim();
  if (!query) return;
  if (!modelReady) { addMessage("El motor de IA aún está cargándose. Espera unos segundos y vuelve a intentarlo.", "system"); return; }
  sendBtn.disabled = true;
  addMessage(query, "user");
  inputEl.value = "";
  addTyping();
  try {
    const results = await buscar(query, true);
    removeTyping();
    if (query.toLowerCase() === "todos") {
      const all = props.map(p => ({ prop: p, score: 0 }));
      all.sort((a, b) => a.prop.zona.localeCompare(b.prop.zona));
      showResults(all, query);
    } else if (results.length === 0) {
      const filters = extractFilters(query);
      let suggest = "piso, casa, chalet, Los Llanos, Tazacorte, El Paso, piscina, garaje, terraza, ascensor, vistas al mar, reformado, amueblado, 2 habitaciones, barato, grande";
      if (filters.tipos.length > 0 || filters.zonas.length > 0 || filters.extras.length > 0) {
        suggest = "prueba con términos más generales o elimina algún filtro";
      }
      addMessage("No encontré viviendas que coincidan exactamente con tu búsqueda. " + suggest + ".", "bot");
    } else {
      showResults(results, query);
    }
  } catch (e) {
    removeTyping();
    console.error("Error en búsqueda:", e);
    const fallback = await searchClassic(query, extractFilters(query));
    if (fallback.length > 0) showResults(fallback, query);
    else addMessage("Hubo un error procesando tu consulta. Intenta de nuevo.", "system");
  }
  sendBtn.disabled = false;
  inputEl.focus();
}

function showResults(results, query) {
  const shown = results.slice(0, 8);
  let filters = extractFilters(query);
  filters = mergeContext(filters, query);
  let html = `<div>He encontrado <strong>${results.length}</strong> resultado${results.length !== 1 ? "s" : ""}`;
  const vc = results.filter(r => r.prop.verificada).length;
  const hc = results.filter(r => !r.prop.verificada).length;
  if (vc > 0 && hc > 0) html += ` (${vc} verificadas, ${hc} históricas)`;
  html += `, mostrando las ${Math.min(shown.length, 8)} más relevantes`;

  const opMap = { "venta": "comprar", "alquiler": "alquilar", "vacacional": "vacacional" };
  if (filters.detected.length > 0) {
    const labels = filters.detected.map(d => {
      if (d.startsWith("zona: ")) return `en <strong>${d.slice(6)}</strong>`;
      if (d.startsWith("tipo: ")) return `<strong>${d.slice(6)}</strong>`;
      if (d.startsWith("operacion: ")) return `para <strong>${opMap[d.slice(11)] || d.slice(11)}</strong>`;
      if (d.startsWith("extra: ")) return `con <strong>${d.slice(6)}</strong>`;
      if (d.startsWith("precio min: ")) return `desde <strong>${formatPrecio(parseInt(d.slice(12)))}</strong>`;
      if (d.startsWith("precio max: ")) return `hasta <strong>${formatPrecio(parseInt(d.slice(12)))}</strong>`;
      if (d.startsWith("min dorm: ")) return `mín. <strong>${d.slice(10)} hab</strong>`;
      if (d.startsWith("orden: ")) return `orden: <strong>${d.slice(7)}</strong>`;
      return d;
    });
    html += ` (${labels.join(", ")})`;
  }

  html += `:</div>`;

  for (const r of shown) html += formatCard(r.prop, r.score);
  if (results.length > 8) html += `<div style="margin-top:8px;font-size:13px;color:#888;">... y ${results.length - 8} más. Sé más específico para ver menos resultados.</div>`;

  addMessage(html, "bot");
}

inputEl.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
