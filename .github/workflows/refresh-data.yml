name: Refresh propiedades.json

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install curl_cffi

      - name: Scrape yaencontre
        run: python scraper/scraper_yaencontre.py

      - name: Validate scraped data
        run: |
          python -c "
import json
d = json.load(open('propiedades.json'))
count = len(d.get('propiedades', []))
print(f'Propiedades: {count}')
if count < 100:
  print(f'ERROR: solo {count} propiedades (esperado >= 100)')
  exit(1)
"

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add propiedades.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: actualizar propiedades.json $(date +%Y-%m-%d)"
          git push
